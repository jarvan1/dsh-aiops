packages:
  - packages/*

# pnpm 10+ treats unreviewed lifecycle scripts as an install error. Only
# esbuild is needed by this repository's prepare step; the denied native
# packages arrive through DSH development peers and are not executed here.
allowBuilds:
  esbuild: true
  '@deepseek-ai/dsh-subprocess-local': false
  koffi: false
  node-pty: false

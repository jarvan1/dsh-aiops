# End-to-end fixture for kube-prometheus-stack / Prometheus Operator.
#
# This file is an illustrative single-scenario manifest. Prefer the guarded,
# repeatable scripts documented in README.md; they inject the URL and Secret
# in memory, exercise the complete matrix, and never commit either value.
#
# Example setup (the token must match AIOPS_ALERTMANAGER_WEBHOOK_SECRET):
#   kubectl create namespace aiops-e2e
#   kubectl -n aiops-e2e create secret generic dsh-aiops-webhook-auth \
#     --from-literal=token='<webhook-secret>'
#   kubectl apply -f deploy/alertmanager/k3s-webhook-e2e.yaml
#
# Cleanup removes the deliberate failure, rule, route, and Secret:
#   kubectl delete namespace aiops-e2e
#
# This fixture deliberately starts one container that exits with status 1. Its
# PrometheusRule fires only for that pod, and its AlertmanagerConfig routes only
# alerts carrying aiops_test=true.
apiVersion: v1
kind: Namespace
metadata:
  name: aiops-e2e
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: dsh-aiops-webhook-e2e
  namespace: aiops-e2e
spec:
  route:
    receiver: dsh-aiops
    groupBy: [alertname, namespace, pod]
    groupWait: 1s
    groupInterval: 10s
    repeatInterval: 1h
    matchers:
      - name: aiops_test
        matchType: "="
        value: "true"
  receivers:
    - name: dsh-aiops
      webhookConfigs:
        # Intentionally non-routable placeholder; the repeatable setup script
        # renders the real deployment-owned URL without changing this file.
        - url: http://dsh-host.example.invalid:3081/alertmanager
          sendResolved: true
          timeout: 10s
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: dsh-aiops-webhook-auth
                key: token
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dsh-aiops-webhook-e2e
  namespace: aiops-e2e
  labels:
    release: prometheus
spec:
  groups:
    - name: dsh-aiops-webhook-e2e
      rules:
        - alert: KubePodCrashLooping
          expr: kube_pod_container_status_restarts_total{namespace="aiops-e2e", pod="crashloop-webhook-test"} > 0
          for: 0m
          labels:
            aiops_test: "true"
            severity: critical
          annotations:
            summary: DSH AIOps real Alertmanager webhook E2E fixture
            description: Intentional exit-1 pod used to verify Prometheus to Alertmanager to DSH routing
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-webhook-test
  namespace: aiops-e2e
  labels:
    app: dsh-aiops-webhook-e2e
spec:
  restartPolicy: Always
  containers:
    - name: crashloop-webhook-test
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo aiops-real-alertmanager-fixture; exit 1"]

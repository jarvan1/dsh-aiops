# DSH AIOps server on Kubernetes.
#
# Apply order:
#   1. Replace the placeholder webhook secret below (or create the Secret out
#      of band and delete it here).
#   2. kubectl apply -f deploy/k8s/dsh-aiops.yaml
#   3. Open the Portal, create a cluster token, and install the agent from
#      agent/deploy with AIOPS_AGENT_SERVER pointing at this Service.
#
# The image is built from ../../Dockerfile. Load it into the cluster with
# `docker save IMAGE | k3s ctr images import -` (or a registry) before
# applying. See ../../deploy/k8s/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
---
apiVersion: v1
kind: Secret
metadata:
  name: dsh-aiops-credentials
  namespace: aiops
type: Opaque
stringData:
  # REPLACE before applying: openssl rand -hex 24
  webhook-secret: replace-me-with-a-long-random-value
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-data
  namespace: aiops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-aiops
  namespace: aiops
  labels: { app: dsh-aiops }
spec:
  # Live agent sockets are process state: run one replica until shared
  # connection routing exists. See the package README.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: dsh-aiops }
  template:
    metadata:
      labels: { app: dsh-aiops }
    spec:
      securityContext:
        fsGroup: 0
      containers:
        - name: dsh
          image: dsh-aiops:0.2.0-rc.1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: web, containerPort: 8080 }
            - { name: webhook, containerPort: 3081 }
          env:
            - { name: DSH_HOME, value: /data }
            - { name: AIOPS_WORKSPACE, value: /data/workspace }
            # Public origin used for generated links; must match how browsers
            # and remote agents reach this server.
            - { name: DSH_PUBLIC_URL, value: "https://aiops.example.com" }
            # Host authorities DSH accepts. Include the public host and the
            # address in-cluster agents dial, or the agent upgrade request is
            # refused. Add the node/ClusterIP authority too when testing
            # without a proxy.
            - name: DSH_TRUSTED_HOSTS
              value: "aiops.example.com aiops.example.com:443 dsh-aiops.aiops.svc.cluster.local:8080"
            # Optional: point the observation tools at in-cluster services.
            # - { name: PROMETHEUS_URL, value: "http://prometheus.monitoring.svc:9090" }
            # - { name: ALERTMANAGER_URL, value: "http://alertmanager.monitoring.svc:9093" }
            - name: AIOPS_ALERTMANAGER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: dsh-aiops-credentials, key: webhook-secret }
          readinessProbe:
            httpGet: { path: /api/aiops/readyz, port: web }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/aiops/healthz, port: web }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: dsh-data }
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-aiops
  namespace: aiops
spec:
  selector: { app: dsh-aiops }
  ports:
    - { name: web, port: 8080, targetPort: web }
    - { name: webhook, port: 3081, targetPort: webhook }

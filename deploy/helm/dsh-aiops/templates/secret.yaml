{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsh-aiops.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-aiops.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.existingSecretKey }}: {{ required "Set credentials.webhookSecret or credentials.existingSecret" .Values.credentials.webhookSecret | b64enc | quote }}
{{- end }}

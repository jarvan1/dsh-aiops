{{- if not .Values.token.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsh-aiops-agent.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-aiops-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.token.existingSecretKey }}: {{ required "Set token.existingSecret or token.value" .Values.token.value | quote }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-aiops-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-aiops-agent.labels" . | nindent 4 }}
spec:
  # One live connection per cluster; a replacement Pod takes over the name.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dsh-aiops-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsh-aiops-agent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "dsh-aiops-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --token-file=/var/run/aiops/{{ .Values.token.existingSecretKey }}
            - --heartbeat={{ .Values.heartbeat }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: AIOPS_AGENT_SERVER
              value: {{ required "Set cluster.serverUrl to the address reachable from this cluster" .Values.cluster.serverUrl | quote }}
            - name: AIOPS_AGENT_NAME
              value: {{ required "Set cluster.name to the token's cluster name" .Values.cluster.name | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: token
              mountPath: /var/run/aiops
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: {{ include "dsh-aiops-agent.tokenSecretName" . }}
            defaultMode: 0444
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.rbac.create }}
# The rules mirror the agent's executor allowlist: the agent can read the
# listed object kinds and pod logs, and nothing else. It cannot read Secrets
# or mutate anything. Change this together with the agent's resource table.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dsh-aiops-agent.clusterRoleName" . }}
  labels:
    {{- include "dsh-aiops-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - events
      - persistentvolumeclaims
      - nodes
      - namespaces
      - persistentvolumes
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dsh-aiops-agent.clusterRoleName" . }}
  labels:
    {{- include "dsh-aiops-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dsh-aiops-agent.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dsh-aiops-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

# Read-only RBAC for one AIOps cluster agent.
#
# The rules mirror internal/kube/resource.go exactly: the agent can read the
# listed object kinds and pod logs, and nothing else. It cannot create, patch,
# delete, exec, or read Secrets. Change both files together.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-agent
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-agent-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - events
      - persistentvolumeclaims
      - nodes
      - namespaces
      - persistentvolumes
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-agent-reader
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops
